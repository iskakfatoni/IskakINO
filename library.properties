sentence=Unified IskakINO ecosystem: fast GPIO, hybrid storage, LCD/OLED, WiFi portal, NTP, MQTT, Telegram, RTC, sensors suite, JSON parser/builder, BLE, DFPlayer voice, and Basic I/O Shield in one library.
paragraph=Penggabungan seluruh ekosistem IskakINO menjadi satu library dengan shared core. Modul universal (ArduFast, Storage, LCD, OLED, Button, Relay, Filter, RTC, Sensors Suite, JSON, SmartVoice, Buzzer) bekerja di AVR, ESP32, dan ESP8266; modul khusus WiFi (WifiPortal, FastNTP, MQTT, Telegram) aktif di ESP32/ESP8266; modul Cam dan BLE aktif khusus di ESP32; modul BasicIOShield aktif khusus di board AVR.
