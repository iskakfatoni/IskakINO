sentence=Unified IskakINO ecosystem: fast GPIO, hybrid storage, LCD/OLED, WiFi portal, NTP, MQTT, Telegram, WebSockets, PrayerTimes, RTC, sensors suite, JSON, BLE, TaskCore, DFPlayer voice, and Basic I/O Shield in one library.
paragraph=Penggabungan seluruh ekosistem IskakINO menjadi satu library dengan shared core. Modul universal (ArduFast, Storage, LCD, OLED, Button, Relay, Filter, RTC, Sensors Suite, JSON, PrayerTimes, SmartVoice, Buzzer) bekerja di AVR, ESP32, dan ESP8266; modul khusus WiFi (WifiPortal, FastNTP, MQTT, Telegram, WebSockets) aktif di ESP32/ESP8266; modul Cam, BLE, dan TaskCore aktif khusus di ESP32; modul BasicIOShield aktif khusus di board AVR.
