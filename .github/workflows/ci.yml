name: IskakINO CI

on:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/**'
      - 'library.properties'
      - 'library.json'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/**'
      - 'library.properties'
      - 'library.json'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # Kompilasi nyata lewat arduino-cli lintas board resmi.
  # Memvalidasi langsung dengan toolchain resmi:
  #   - Arduino AVR (Uno)
  #   - ESP8266 (NodeMCU v2)
  #   - ESP32 (Dev Module)
  # ---------------------------------------------------------------------
  arduino-cli-compile:
    name: Compile (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: "arduino:avr:uno"
            core: "arduino:avr"
            extra_url: ""
          - board: "esp8266:esp8266:nodemcuv2"
            core: "esp8266:esp8266"
            extra_url: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
          - board: "esp32:esp32:esp32"
            core: "esp32:esp32"
            extra_url: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino Core (${{ matrix.core }})
        run: |
          if [ -n "${{ matrix.extra_url }}" ]; then
            arduino-cli core update-index --additional-urls "${{ matrix.extra_url }}"
            arduino-cli core install ${{ matrix.core }} --additional-urls "${{ matrix.extra_url }}"
          else
            arduino-cli core update-index
            arduino-cli core install ${{ matrix.core }}
          fi

      - name: Link Library ke Arduino Libraries Directory
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/IskakINO

      - name: Compile Examples Universal (AVR, ESP8266, ESP32)
        run: |
          for ex in 01_ArduFast_TaskManager 02_Storage_SaveLoad 03_LCD_TypewriterScroll 04_SmartVoice_PlayTrack 11_Buzzer_MelodyBeep 12_OLED_GraphicsAnimation 13_Button_MultiGesture 14_Relay_PulseBlink 15_Filter_SensorSmoothing 19_RTC_ClockCalendar 21_Sensors_DHT_Environment 22_Sensors_DS18B20_1Wire 23_Sensors_Ultrasonic_Filtered 25_JSON_BuildAndParse; do
            echo "=========================================="
            echo "Compiling: $ex on ${{ matrix.board }}"
            echo "=========================================="
            arduino-cli compile --fqbn ${{ matrix.board }} examples/$ex --libraries $HOME/Arduino/libraries
          done

      - name: Compile Examples Khusus WiFi (ESP8266 & ESP32)
        if: matrix.board != 'arduino:avr:uno'
        run: |
          for ex in 05_WifiPortal_CaptivePortal 06_FastNTP_ClockSync 07_Unified_SmartClock 08_Framework_Kernel 17_MQTT_Telemetry 18_Telegram_AlertBot 20_RTC_HybridNTP; do
            echo "=========================================="
            echo "Compiling: $ex on ${{ matrix.board }}"
            echo "=========================================="
            arduino-cli compile --fqbn ${{ matrix.board }} examples/$ex --libraries $HOME/Arduino/libraries
          done

      - name: Compile Examples Khusus ESP32 (SmartSchoolBell, Cam, & BLE)
        if: matrix.board == 'esp32:esp32:esp32'
        run: |
          for ex in 09_SmartSchoolBell 16_ESP32Cam_SnapshotStream 24_BLE_SerialTerminal; do
            echo "=========================================="
            echo "Compiling: $ex on ${{ matrix.board }}"
            echo "=========================================="
            arduino-cli compile --fqbn ${{ matrix.board }} examples/$ex --libraries $HOME/Arduino/libraries
          done

      - name: Compile Example 10_BasicIOShield_Overview (Khusus AVR)
        if: matrix.board == 'arduino:avr:uno'
        run: |
          echo "=========================================="
          echo "Compiling: 10_BasicIOShield_Overview on ${{ matrix.board }}"
          echo "=========================================="
          arduino-cli compile --fqbn ${{ matrix.board }} examples/10_BasicIOShield_Overview --libraries $HOME/Arduino/libraries
